<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞标展示 · Angel Sound &amp; Light</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="../logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bid.css">
<style>
  html,body{overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column}
  .stage-top{display:flex;align-items:center;justify-content:space-between;padding:clamp(18px,3vw,40px) clamp(24px,4vw,60px)}
  .stage-brand{display:flex;align-items:center;gap:14px}
  .stage-brand img{width:clamp(36px,4vw,54px);height:clamp(36px,4vw,54px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
  .stage-brand span{font-family:var(--serif-cn);letter-spacing:.14em;font-size:clamp(.9rem,1.4vw,1.2rem);color:var(--champagne-2)}
  .stage-event{font-family:var(--serif-en);font-style:italic;color:var(--muted);font-size:clamp(.85rem,1.2vw,1.1rem)}

  .stage-main{
    flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,4vw,70px);
    align-items:center;padding:0 clamp(24px,5vw,80px);min-height:0;
  }
  .photo-frame{
    position:relative;height:100%;max-height:82vh;border-radius:18px;overflow:hidden;
    background:#000 center/cover no-repeat;box-shadow:0 50px 100px -40px rgba(0,0,0,.7);
    border:1px solid var(--line);
  }
  .photo-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.55));}
  .item-badge{
    position:absolute;top:22px;left:22px;z-index:2;padding:8px 18px;border-radius:100px;
    background:rgba(12,11,10,.55);backdrop-filter:blur(6px);font-family:var(--serif-en);font-style:italic;
    font-size:clamp(.85rem,1.2vw,1.1rem);color:var(--champagne-2);border:1px solid var(--line);
  }
  .live-badge{
    position:absolute;top:22px;right:22px;z-index:2;display:flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:100px;background:rgba(12,11,10,.55);border:1px solid rgba(217,83,79,.5);
    font-size:.8rem;letter-spacing:.2em;color:#ff8a80;
  }
  .live-dot{width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}

  .sold-overlay{
    position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    background:rgba(12,11,10,.6);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;
  }
  .sold-overlay.show{opacity:1;visibility:visible}
  .sold-ribbon{
    border:4px solid var(--champagne);color:var(--champagne-2);font-family:var(--serif-en);font-style:italic;
    font-size:clamp(2.2rem,5vw,4.5rem);padding:10px 50px;transform:rotate(-7deg);border-radius:14px;
    background:rgba(12,11,10,.55);letter-spacing:.1em;
  }

  .info-col{display:flex;flex-direction:column;gap:clamp(10px,2vw,22px);min-width:0}
  .info-eyebrow{font-family:var(--serif-en);font-style:italic;color:var(--bronze);letter-spacing:.2em;font-size:clamp(.9rem,1.2vw,1.2rem)}
  .info-name{font-family:var(--serif-cn);font-weight:700;font-size:clamp(1.8rem,4.2vw,3.6rem);line-height:1.2;word-break:break-word}
  .info-start{color:var(--muted);font-size:clamp(.85rem,1.1vw,1.1rem)}
  .price-box{margin-top:clamp(10px,2vw,20px)}
  .price-label{font-size:clamp(.8rem,1vw,1rem);letter-spacing:.26em;color:var(--muted);margin-bottom:6px}
  .price-value{
    font-family:var(--serif-en);font-weight:600;font-size:clamp(3.2rem,9vw,8rem);line-height:1;
    background:linear-gradient(180deg,#fff,var(--champagne-2));-webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .sold-info{
    margin-top:10px;display:inline-flex;align-items:center;gap:10px;color:#8fe3ab;font-size:clamp(.95rem,1.2vw,1.2rem);
    opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;
  }
  .sold-info.show{opacity:1;transform:none}

  .stage-bottom{padding:clamp(16px,2.6vw,34px) clamp(24px,5vw,80px);display:flex;justify-content:center}
  .dots{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:90vw}
  .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);background:transparent}
  .dot.is-sold{background:var(--green);border-color:var(--green)}
  .dot.is-current{transform:scale(1.5);border-color:var(--champagne)}

  .particles{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .spark{position:absolute;bottom:-20px;font-size:var(--s);opacity:0}

  @media (max-width:860px){
    .stage-main{grid-template-columns:1fr;grid-template-rows:1.1fr 1fr;padding:0 20px}
    .photo-frame{max-height:46vh}
    .info-col{align-items:flex-start}
  }
</style>
</head>
<body>

<div class="pin-gate" id="pinGate">
  <img src="../logo.jpg" alt="" class="logo">
  <h1>宴会竞标大屏幕</h1>
  <p class="sub">请输入 6 位数宴会 PIN 码，进入这场宴会的竞标展示画面。</p>
  <div class="pin-inputs" id="pinInputs">
    <input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1">
    <input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1">
    <input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1">
  </div>
  <p class="pin-error" id="pinError"></p>
</div>

<div class="stage hidden" id="app">
  <div class="stage-top">
    <div class="stage-brand"><img src="../logo.jpg" alt=""><span>天使娱乐机构 · ANGEL SOUND &amp; LIGHT</span></div>
    <div class="stage-event" id="eventName"></div>
  </div>

  <div class="stage-main">
    <div class="photo-frame" id="photoFrame">
      <span class="item-badge" id="itemBadge">01 / 10</span>
      <span class="live-badge" id="liveBadge"><span class="live-dot"></span>LIVE 竞标中</span>
      <div class="sold-overlay" id="soldOverlay"><span class="sold-ribbon">已成交 SOLD</span></div>
    </div>
    <div class="info-col">
      <p class="info-eyebrow">Current Lot · 当前竞标物品</p>
      <h1 class="info-name" id="itemName">—</h1>
      <p class="info-start" id="itemStart"></p>
      <div class="price-box">
        <p class="price-label">当前竞标价 CURRENT BID</p>
        <div class="price-value" id="priceValue">0</div>
        <p class="sold-info" id="soldInfo">✓ 成交价 <b id="soldPriceTxt"></b></p>
      </div>
    </div>
  </div>

  <div class="stage-bottom"><div class="dots" id="dots"></div></div>
  <div class="particles" id="particles"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script src="bid-common.js"></script>
<script src="display.js"></script>
</body>
</html>
